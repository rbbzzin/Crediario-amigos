/* Layout: preto e branco, fundo branco liso, linhas cinza finas, links azuis. Menu no topo, tabelas largas com rolagem interna, janelas deslizantes embaixo. */
:root{
  --bg:#ffffff; --surface:#ffffff; --line:#dedede; --fg:#222222; --mute:#6b6b6b; --zebra:#f7f7f7;

  --font-num:'Helvetica Neue',Helvetica,Arial,sans-serif;
}
/* modo escuro desativado — layout sempre claro */

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.35;

.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav .sp{flex:1}
.nav .gear{border:0;background:none;color:var(--mute);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mute);margin-right:6px}

h2{font-family:var(--font-num);font-size:22px;margin:0 0 10px;letter-spacing:.2px}

.twrap{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-family:var(--font-num);text-align:left;font-weight:700;font-size:15px;padding:10px 6px;white-space:nowrap}
td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:middle;font-size:14px;white-space:nowrap}
td.nm{white-space:normal;min-width:110px;max-width:170px;text-transform:uppercase;font-weight:500;cursor:pointer}
/* tabela de cobranças — 9 colunas, fonte pequena, nome quebra linha */
.cob-wrap{overflow-x:hidden}
.cob-wrap table{width:100%;table-layout:fixed;border-collapse:collapse}
.cob-wrap th{font-size:7px;padding:3px 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:2px solid #ddd}
.cob-wrap td{font-size:7px;padding:3px 1px;vertical-align:middle;border-bottom:1px solid #eee}
.cob-wrap td.nm{white-space:normal;word-break:break-word;font-size:7px;line-height:1.3}
.cob-wrap td:not(.nm){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cob-wrap .pg{width:100%;font-size:7px;padding:2px 1px;box-sizing:border-box}
.cob-wrap .mini{font-size:7px;padding:2px 3px;border-radius:3px;letter-spacing:0}
/* Nome | DtEmp | Par | VrPar | Pago | Dev | Atr | b1 | b2 */
.cob-wrap th:nth-child(1),.cob-wrap td:nth-child(1){width:14%}
.cob-wrap th:nth-child(2),.cob-wrap td:nth-child(2){width:12%}
.cob-wrap th:nth-child(3),.cob-wrap td:nth-child(3){width:8%}
.cob-wrap th:nth-child(4),.cob-wrap td:nth-child(4){width:13%}
.cob-wrap th:nth-child(5),.cob-wrap td:nth-child(5){width:13%}

.cob-wrap th:nth-child(7),.cob-wrap td:nth-child(7){width:7%}
.cob-wrap th:nth-child(8),.cob-wrap td:nth-child(8){width:10%}
.cob-wrap th:nth-child(9),.cob-wrap td:nth-child(9){width:10%}
tr.dim td{opacity:.55}
td.pago.zero{background:var(--hl);color:var(--hl-ink);font-weight:600}
td.pago.has{font-weight:600}
td.r{text-align:right}
.pg{width:74px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

.tot{margin-top:18px;border-top:1px solid var(--line)}
.tot .line{display:flex;gap:8px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:16px}

.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:15px}

.form{display:grid;gap:12px;max-width:520px}

function clientRows(){

  var rk=function(x){return x.k.quitado?({a:0,b:1,c:2})[x.k.cls]:(x.k.atr>=1?4:3)};
  rows.sort(function(a,b){
    if(V.csort==='rank')return rk(a)-rk(b)||a.c.nome.localeCompare(b.c.nome,'pt-BR');

function weekData(){
  /* agrupa dias em semanas ISO (seg–dom) */
  var weeks={},t=today(),flds=['recebido','extras','despesas','invest','sangria'];
  var weekKey=function(d){var dt=parse(d),day=dt.getDay(),diff=dt.getDate()-(day===0?6:day-1);var mon=new Date(dt.getFullYear(),dt.getMonth(),diff);return iso(mon)};
  var add=function(d,st){var k=weekKey(d);if(!weeks[k])weeks[k]={key:k,recebido:0,extras:0,despesas:0,invest:0,sangria:0,dias:[]};flds.forEach(function(f){weeks[k][f]+=st[f]||0});weeks[k].dias.push(d)};
  Object.keys(S.days).forEach(function(d){add(d,S.days[d])});
  if(!S.days[t])add(t,dayStats(t));
  return Object.keys(weeks).sort().reverse().map(function(k){var x=weeks[k];flds.forEach(function(f){x[f]=r2(x[f])});x.saldo=r2(x.recebido+x.extras-x.despesas-x.invest);x.end=addDays(k,6);return x});
}

function loanFor(name){
  var n=norm(name);if(!n)return null;
  var cs=S.clients.filter(function(c){return norm(c.nome)===n}).sort(function(a,b){return a.dataEmp<b.dataEmp?1:-1});
  if(!cs.length)return null;
  return cs.filter(function(c){return !calc(c).quitado})[0]||cs[0];
}
function autoLoan(id,val){
  var pre=id==='pd-nome'?'pd':'inf',c=loanFor(val),a=$('#'+pre+'-vIni'),b=$('#'+pre+'-vDia'),h=$('#'+pre+'-hint');
  if(!a||!b)return;
  if(c){a.value=String(r2(c.total));b.value=String(r2(c.vrParc));if(h)h.textContent='Preenchido com o empréstimo de '+br(c.dataEmp)+': '+c.n+'x de '+fmt(c.vrParc)+'.'}
  else if(h)h.textContent='';
}
function saveInfoForm(){
  var keys=['apelido','nome','fone','cel','resRua','resNum','resBairro','comRua','comNum','comCompl','comCep','comBairro','comCidade','cpf','rg','mae','vIni','vDia','obs'],d={};
  keys.forEach(function(k){d[k]=$('#inf-'+k).value.trim()});
  if(!d.apelido&&!d.nome){toast('Informe o apelido ou o nome');return}
  var i=M.id?S.infos.filter(function(x){return x.id===M.id})[0]:null;
  if(!i){i={id:uid(),createdAt:Date.now()};S.infos.push(i)}
  Object.assign(i,d);saveInfo(i);closeModal();render(true);toast('Informações salvas');
}
function paradosRows(){
  var groups={},rows=[];
  S.clients.forEach(function(c){var k=norm(c.nome);(groups[k]=groups[k]||[]).push(c)});
  Object.keys(groups).forEach(function(k){var cs=groups[k];if(cs.every(function(c){return calc(c).quitado}))rows.push({key:k,nome:cs[0].nome,cpf:'',cel:'',pid:null})});
  S.parados.forEach(function(p){
    var k=norm(p.nome),ex=rows.filter(function(r){return r.key===k})[0];
    if(ex){ex.pid=p.id;ex.cpf=p.cpf||'';ex.cel=p.cel||''}else rows.push({key:k,nome:p.nome,cpf:p.cpf||'',cel:p.cel||'',pid:p.id});
  });
  rows.forEach(function(r){var inf=findInfo(r.nome);if(inf){if(!r.cpf)r.cpf=inf.cpf||'';if(!r.cel)r.cel=inf.cel||''}});
  return rows.sort(function(a,b){return a.nome.localeCompare(b.nome,'pt-BR')});
}
function viewParados(){
  var rows=paradosRows();
  var h='<div class="band">'+br(today())+' &nbsp;<b>Clientes Parados</b></div><div class="search" style="margin-top:12px"><span class="mut" style="flex:1 1 150px;align-self:center">'+rows.length+' clientes parados. Toque no nome para ver o histórico.</span><button class="btn sm" data-act="pd-new">Adicionar parado</button></div>';
  if(!rows.length)return h+'<div class="empty"><b>Nenhum cliente parado</b>Quem quitar a dívida aparece aqui. Você também pode adicionar alguém na mão.</div>';
  h+='<div class="twrap"><table class="zeb info"><thead><tr><th>CPF</th><th>Nome</th><th>Celular</th></tr></thead><tbody>';
  rows.forEach(function(r){h+='<tr><td class="lk">'+dash(r.cpf)+'</td><td class="nm" data-act="hist" data-n="'+esc(r.nome)+'">'+esc(r.nome)+' (X)</td><td class="lk">'+dash(r.cel)+'</td></tr>'});
  return h+'</tbody></table></div>';
}

function saveParadoForm(){
  var nome=$('#pd-nome').value.trim();if(!nome){toast('Informe o nome');return}
  var p=M.pid?S.parados.filter(function(x){return x.id===M.pid})[0]:null;

  saveParado(p);closeModal();render(true);toast('Cliente parado salvo');

function historyModal(name){
  M={type:'hist',name:name};
  var info=findInfo(name),keys=[norm(name)];if(info){keys.push(norm(info.nome),norm(info.apelido))}
  var loans=S.clients.filter(function(c){return keys.indexOf(norm(c.nome))>-1}).sort(function(a,b){return a.dataEmp<b.dataEmp?-1:1});
  var man=S.parados.filter(function(p){return norm(p.nome)===norm(name)})[0];
  var emp=0,pago=0,late=0,maxl=0;
  var blocks=loans.map(function(c){
    var k=calc(c),cum=0;emp+=c.valor;pago+=k.pago;
    var lines=k.pays.map(function(p){
      cum+=p.valor;
      var done=cum>=c.total-0.005,par=done?c.n:r2(cum/c.vrParc),dt=br(p.date)+' <span class="mut">('+wd(p.date)+')</span>';
      if(p.atrBefore>0.01){late++;if(p.atrBefore>maxl)maxl=p.atrBefore}
      if(p.zero)return '<div class="hrow"><span>Não pagou · '+dt+'</span><b class="mut">R$ 0,00</b></div>';
      var lab=p.kit?'Quitou o restante ('+c.n+'/'+c.n+')':fmtN(par)+'/'+c.n;
      return '<div class="hrow"><span>'+lab+' · '+dt+(p.atrBefore>0.01?' <span class="badge c">atrasado</span>':'')+'</span><b>'+fmt(p.valor)+'</b></div>';
    }).join('');
    return '<div class="card"><div class="ch"><span>Empréstimo de '+br(c.dataEmp)+'</span>'+situacao(k)+'</div><p class="sub">'+fmt(c.valor)+' + '+fmtN(c.pct)+'% = '+fmt(c.total)+' em '+c.n+'x de '+fmt(c.vrParc)+'</p>'+
      (lines||'<p class="sub">Nenhum pagamento ainda.</p>')+
      (k.quitado?'<div class="hrow"><b>Quitado em '+br(k.quitDate)+' <span class="mut" style="font-weight:400">('+wd(k.quitDate)+')</span></b></div>':'<div class="hrow"><b>Devendo '+fmt(k.dev)+'</b><span class="'+(k.atr>=1?'red':'mut')+'">atraso: '+fmtN(k.atr)+'</span></div>')+'</div>';
  }).join('');
  var atrTxt=String(late)+(man&&man.atrasos?' (+'+esc(man.atrasos)+' anotados)':'');
  openModal('<h3 style="text-transform:uppercase">'+esc(name)+'</h3>'+
    (info&&(info.cel||info.fone)?'<p class="sub lk">'+esc(info.cel||info.fone)+'</p>':'')+
    '<div class="kv"><div><span>Empréstimos</span><b>'+loans.length+'</b></div><div><span>Atrasos</span><b>'+atrTxt+'</b></div>'+
    '<div><span>Total emprestado</span><b>'+fmt(emp)+'</b></div><div><span>Total pago</span><b>'+fmt(pago)+'</b></div>'+
    '<div><span>Maior atraso</span><b>'+fmtN(maxl)+' dia(s)</b></div></div>'+
    (man&&man.motivo?'<div class="card" style="background:var(--soft)"><span class="mut" style="font-size:12px;font-weight:600">MOTIVO / OBSERVAÇÃO</span><br>'+esc(man.motivo)+'</div>':'')+
    (blocks||'<p class="sub">Este cliente não tem empréstimos registrados neste site.</p>')+
    '<div class="stack">'+(info?'<button class="btn ghost block" data-act="info-open" data-n="'+esc(name)+'">Ver e editar informações (i)</button>':'')+
    (man?'<button class="btn ghost block" data-act="pd-edit" data-id="'+man.id+'">Editar dados do parado</button>':'')+'</div>');
}

var VIEWS={cobranca:viewCobranca,novo:viewNovo,despesas:viewDespesas,informacoes:viewInfo,parados:viewParados,relatorios:viewRelatorios};

function render(force){
  lastDay=today();
  var a=document.activeElement,view=$('#view');
  if(!force&&a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&view.contains(a)&&a.className.indexOf('pg')<0)return;
  var keep={};view.querySelectorAll('.pg').forEach(function(i){if(i.value)keep[i.id]=i.value});
  document.querySelectorAll('#nav a').forEach(function(l){if(l.dataset.r===V.route)l.setAttribute('aria-current','page');else l.removeAttribute('aria-current')});
  view.innerHTML=(VIEWS[V.route]||viewCobranca)();
  Object.keys(keep).forEach(function(id){var i=document.getElementById(id);if(i)i.value=keep[id]});
  if(V.route==='novo')ncPreview();
  paintSync();
}
function route(){
  var h=(location.hash||'').replace('#','');
  V.route=VIEWS[h]?h:'cobranca';V.del=null;render(true);window.scrollTo(0,0);
}
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},2600)}

function getC(id){return S.clients.filter(function(c){return c.id===id})[0]}
function payModal(){
  var c=getC(M.id);if(!c){closeModal();return}
  var t=today(),k=calc(c,t,M.alt?t:null),alt=M.alt?calc(c,t):null;
  if(k.dev<0.005){closeModal();return}
  M.count=Math.max(1,Math.min(M.count||1,k.rem));
  var chips='';for(var i=1;i<=Math.min(k.rem,6);i++)chips+='<button data-act="pm-set" data-n="'+i+'" aria-pressed="'+(M.count===i)+'">'+i+'x · '+fmt(Math.min(k.dev,i*c.vrParc))+'</button>';
  if(k.rem>6)chips+='<button data-act="pm-set" data-n="'+k.rem+'" aria-pressed="'+(M.count===k.rem)+'">Todas · '+fmt(k.dev)+'</button>';
  openModal('<h3>'+esc(c.nome)+'</h3><p class="sub">Parcela '+fmt(c.vrParc)+' · '+fmtN(k.parc)+'/'+c.n+' pagas · Devendo '+fmt(k.dev)+'</p>'+

/* ---------- eventos ---------- */
document.addEventListener('click',function(e){
  var m=$('#modal');if(e.target===m){closeModal();return}
  var n=e.target.closest('[data-act]');if(!n)return;
  var act=n.dataset.act,id=n.dataset.id,c=id?getC(id):null;
  switch(act){
    case 'day-detail':
      c=getC(id);if(!c)break;var kd=calc(c);M={type:'dayview',id:id};
      var pdlist=kd.pays.map(function(p){return '<tr><td>'+br(p.date)+' <span class="mut">('+wd(p.date)+')</span></td><td>'+(p.zero?'—':fmtN(p.parcelas)+'x')+'</td><td>'+(p.zero?'Não pagou':fmt(p.valor))+'</td><td>'+(p.kit?'<span class="badge late">KIT</span>':p.atrBefore>0.01?'<span class="badge c">atrasado</span>':'')+'</td></tr>'}).join('');
      openModal('<h3 style="text-transform:uppercase">'+esc(c.nome)+'</h3><p class="sub">Somente leitura — para alterar use a tela de Cobrança.</p>'+
        '<div class="kv"><div><span>Total emprestado</span><b>'+fmt(c.valor)+'</b></div><div><span>Total a pagar</span><b>'+fmt(c.total)+'</b></div>'+
        '<div><span>Parcelas</span><b>'+fmtN(kd.parc)+'/'+c.n+'</b></div><div><span>Atrasos</span><b class="'+(kd.atr>=1?'red':kd.atr<0?'grn':'')+'">'+fmtN(kd.atr)+'</b></div>'+
        '<div><span>Pago</span><b>'+fmt(kd.pago)+'</b></div><div><span>Devendo</span><b>'+fmt(kd.dev)+'</b></div></div>'+
        '<h3 style="font-size:16px">Histórico de parcelas</h3>'+(pdlist?'<div class="twrap"><table><thead><tr><th>Dia</th><th>Parcelas</th><th>Valor</th><th></th></tr></thead><tbody>'+pdlist+'</tbody></table></div>':'<p class="sub">Nenhum pagamento.</p>'));
      break;
    case 'hist':historyModal(n.dataset.n);break;
    case 'info-new':V.del=null;infoForm(null);break;
    case 'info-i':V.del=null;infoForm(id);break;
    case 'info-open':var inf=findInfo(n.dataset.n);if(inf){V.del=null;infoForm(inf.id)}break;
    case 'info-del':
      if(V.del!=='info'){V.del='info';infoForm(M.id)}
      else{var iid=M.id;S.infos=S.infos.filter(function(x){return x.id!==iid});persist();dbDel('infos',iid);V.del=null;closeModal();render(true);toast('Cliente excluído')}
      break;
    case 'pd-new':V.del=null;paradoForm(null);break;
    case 'pd-edit':V.del=null;paradoForm(id);break;
    case 'pd-del':
      if(V.del!=='pd'){V.del='pd';paradoForm(M.pid)}
      else{var pdid=M.pid;S.parados=S.parados.filter(function(x){return x.id!==pdid});persist();dbDel('parados',pdid);V.del=null;closeModal();render(true);toast('Removido da lista')}
      break;
    case 'close':closeModal();break;
    case 'config':configModal();break;
    case 'detail':V.del=null;detailModal(id);break;
    case 'pay':openPay(id,false);break;
    case 'alt':openPay(id,true);break;
    case 'kit':kitModal(id);break;
    case 'ok':
      var inp=document.getElementById('pg-'+id),v=inp?num(inp.value):NaN;
      if(c&&v>0){var paid=addPayment(c,v);mutated();toast('Pagamento de '+fmt(paid)+' confirmado')}else openPay(id,false);
      break;
    case 'pm-set':M.count=+n.dataset.n;M.custom='';payModal();break;
    case 'pm-inc':M.count++;M.custom='';payModal();break;
    case 'pm-dec':M.count--;M.custom='';payModal();break;
    case 'pm-undo':c=getC(M.id);removeToday(c);closeModal();mutated();toast('Pagamento de hoje desfeito');break;
    case 'pm-confirm':
    case 'pm-zero':
      c=getC(M.id);var t=today(),k=calc(c,t,M.alt?t:null);
      var val=act==='pm-zero'?0:pmValue(c,k);
      if(act==='pm-confirm'&&!(val>0)){toast('Informe um valor maior que zero');break}
      if(M.alt)c.payments=c.payments.filter(function(p){return p.date!==t});
      var pd=addPayment(c,val);closeModal();mutated();
      toast(act==='pm-zero'?'Registrado: não pagou hoje':'Pagamento de '+fmt(pd)+' confirmado');
      break;
    case 'kit-confirm':
      c=getC(M.id);var kk=calc(c);addPayment(c,kk.dev,{kit:true});closeModal();mutated();toast(esc(c.nome)+' quitado');break;
    case 'dt-save':
      c=getC(M.id);var nm=$('#dt-nome').value.trim();if(nm){c.nome=nm;saveClient(c);mutated();toast('Nome atualizado')}break;
    case 'pay-askdel':V.del='pay:'+n.dataset.pid;detailModal(M.id);break;
    case 'pay-delcancel':V.del=null;detailModal(M.id);break;
    case 'pay-del':
      c=getC(M.id);var pid=n.dataset.pid;c.payments=c.payments.filter(function(p){return p.id!==pid});saveClient(c);V.del=null;mutated();toast('Pagamento excluído');detailModal(M.id);break;
    case 'dt-del':
      if(V.del!=='cli'){V.del='cli';detailModal(M.id)}
      else{var cid=M.id;S.clients=S.clients.filter(function(x){return x.id!==cid});persist();dbDel('clients',cid);V.del=null;closeModal();mutated();toast('Cliente excluído')}
      break;
    case 'cf-save':
      S.cfg.rota=$('#cf-rota').value.trim()||'ROTA';S.cfg.offset=+$('#cf-off').value;S.cfg.skipWeekend=$('#cf-wknd').checked;S.cfg.skipSunday=false;
      persist();pushMeta();closeModal();mutated();toast('Ajustes salvos');break;
    case 'bk-copy':
      var ta=$('#bk-out');ta.select();
      try{navigator.clipboard.writeText(ta.value).then(function(){toast('Cópia feita')},function(){toast('Texto selecionado. Use copiar do aparelho')})}catch(x){toast('Texto selecionado. Use copiar do aparelho')}
      break;
    case 'bk-restore':restoreBackup($('#bk-in').value);break;
    case 'bk-import-demo':restoreBackup(IMPORT_DATA);break;
    case 'rep':V.rep=n.dataset.v;V.del=null;render(true);break;
    case 'cf':V.cfilter=n.dataset.v;render(true);break;
    case 'dayopen':V.openDay[n.dataset.d]=!V.openDay[n.dataset.d];render(true);break;
    case 'askdel':V.del=n.dataset.k;render(true);break;
    case 'cancel':V.del=null;render(true);break;
    case 'dodel':
      var key=n.dataset.k.split(':');
      if(key[0]==='day'){delete S.days[key[1]];dbDel('days',key[1])}
      else Object.keys(S.days).forEach(function(d){if(d.slice(0,7)===key[1]){delete S.days[d];dbDel('days',d)}});
      persist();V.del=null;render(true);toast('Relatório excluído');break;
    case 'exp-edit':V.expEdit=id;V.del=null;render(true);window.scrollTo(0,0);break;
    case 'exp-cancel':V.expEdit=null;V.del=null;render(true);break;
    case 'exp-del':
      if(V.del!=='exp'){V.del='exp';render(true)}
      else{var xid=V.expEdit;S.expenses=S.expenses.filter(function(x){return x.id!==xid});persist();dbDel('expenses',xid);V.expEdit=null;V.del=null;mutated();toast('Despesa excluída')}
      break;
  }
});
document.addEventListener('input',function(e){
  var id=e.target.id;
  if(id==='pm-custom'&&M&&M.type==='pay'){
    M.custom=e.target.value;var c=getC(M.id),t=today();if(!c)return;
    $('#pm-total').textContent=fmt(pmValue(c,calc(c,t,M.alt?t:null)));
  }else if(id==='cl-q'){V.q=e.target.value;$('#cl-table').innerHTML=clientTable()}
  else if(id==='inf-apelido'||id==='inf-nome'||id==='pd-nome'){autoLoan(id,e.target.value)}
  else if(id==='in-q'){V.iq=e.target.value;$('#in-table').innerHTML=infoTable()}
  else if(/^nc-(valor|pct|n)$/.test(id))ncPreview();
});
document.addEventListener('change',function(e){
  if(e.target.id==='cl-sort'){V.csort=e.target.value;$('#cl-table').innerHTML=clientTable()}
  else if(e.target.id==='ex-filter'&&e.target.value){V.expDate=e.target.value;V.expEdit=null;render(true)}
});
document.addEventListener('submit',function(e){
  e.preventDefault();
  if(e.target.id==='nc-form'){
    var nome=$('#nc-nome').value.trim(),dt=$('#nc-data').value,v=num($('#nc-valor').value),p=num($('#nc-pct').value),n=parseInt($('#nc-n').value,10);
    if(!nome||!dt||!(v>0)||isNaN(p)||!(n>0)){toast('Confira os campos do cliente');return}
    var total=r2(v*(1+p/100));
    var c={id:uid(),nome:nome,dataEmp:dt,valor:r2(v),pct:p,n:n,total:total,vrParc:r2(total/n),payments:[],createdAt:Date.now()};
    S.clients.push(c);saveClient(c);mutated();toast(nome+' adicionado: 0/'+n+' parcelas');
  }else if(e.target.id==='inf-form'){saveInfoForm()
  }else if(e.target.id==='pd-form'){saveParadoForm()
  }else if(e.target.id==='ex-form'){
    var desc=$('#ex-desc').value.trim(),val=num($('#ex-valor').value),d=$('#ex-data').value;
    if(!desc||!(val>0)||!d){toast('Confira os campos da despesa');return}
    if(V.expEdit){var x=S.expenses.filter(function(y){return y.id===V.expEdit})[0];if(x){x.desc=desc;x.valor=r2(val);x.date=d;saveExpense(x)}V.expEdit=null;toast('Despesa alterada')}
    else{var ex={id:uid(),desc:desc,valor:r2(val),date:d,ts:Date.now()};S.expenses.push(ex);saveExpense(ex);toast('Despesa adicionada')}
    V.expDate=d;V.del=null;mutated();
  }
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
window.addEventListener('hashchange',route);

function restoreBackup(txt){
  var b;try{b=JSON.parse(txt)}catch(x){toast('Texto da cópia inválido');return}
  if(!b||!Array.isArray(b.clients)||!Array.isArray(b.expenses)){toast('Texto da cópia inválido');return}
  S.clients.forEach(function(c){dbDel('clients',c.id)});S.expenses.forEach(function(x){dbDel('expenses',x.id)});Object.keys(S.days).forEach(function(d){dbDel('days',d)});S.infos.forEach(function(x){dbDel('infos',x.id)});S.parados.forEach(function(x){dbDel('parados',x.id)});
  S.clients=b.clients;S.expenses=b.expenses;S.days=b.days||{};S.infos=b.infos||[];S.parados=b.parados||[];S.cfg=Object.assign(S.cfg,b.cfg||{});
  S.clients.forEach(function(c){dbSet('clients',c.id,c)});S.expenses.forEach(function(x){dbSet('expenses',x.id,x)});Object.keys(S.days).forEach(function(d){dbSet('days',d,Object.assign({id:d},S.days[d]))});
  S.infos.forEach(function(x){dbSet('infos',x.id,x)});S.parados.forEach(function(x){dbSet('parados',x.id,x)});persist();pushMeta();closeModal();mutated();toast('Cópia restaurada');
}

/* ---------- nuvem ---------- */
function onReady(){closeDays();refreshStats();render()}
function attach(){
  var lc=function(col,get,set,pushAll){
    DB.collection(col).onSnapshot(function(snap){
      if(snap.metadata.fromCache)return;
      var list=snap.docs.map(function(d){return Object.assign({id:d.id},J(d.data()))});
      if(!list.length&&get()&&!mig[col]){mig[col]=1;pushAll();return}
      mig[col]=1;set(list);persist();render();
    },function(){SY='error';paintSync()});
  };
  lc('clients',function(){return S.clients.length},function(l){S.clients=l},function(){S.clients.forEach(function(c){dbSet('clients',c.id,c)})});
  lc('expenses',function(){return S.expenses.length},function(l){S.expenses=l},function(){S.expenses.forEach(function(x){dbSet('expenses',x.id,x)})});
  lc('days',function(){return Object.keys(S.days).length},function(l){var m={};l.forEach(function(d){m[d.id]=d});S.days=m},function(){Object.keys(S.days).forEach(function(d){saveDay(d)})});
  lc('infos',function(){return S.infos.length},function(l){S.infos=l},function(){S.infos.forEach(function(x){dbSet('infos',x.id,x)})});
  lc('parados',function(){return S.parados.length},function(l){S.parados=l},function(){S.parados.forEach(function(x){dbSet('parados',x.id,x)})});
  DB.doc('meta/main').onSnapshot(function(snap){
    if(snap.metadata.fromCache)return;
    if(snap.exists){var m=J(snap.data());S.cfg=Object.assign(S.cfg,m.cfg||{});S.closedUntil=m.closedUntil||S.closedUntil;S.todayStats=m.todayStats||null}
    else{if(!S.closedUntil)S.closedUntil=addDays(today(),-1);pushMeta()}
    SY='cloud';persist();paintSync();
    if(!ready){ready=true;onReady()}else render();
  },function(){SY='error';paintSync()});
}
function tick(){if(today()!==lastDay){if(ready){closeDays();refreshStats()}render()}}
setInterval(tick,30000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)tick()});

route();
var fin=function(){if(!ready){ready=true;if(!S.closedUntil)S.closedUntil=addDays(today(),-1);onReady()}};
try{
  if(window.claude&&window.claude.use){
    window.claude.use('db').then(function(db){if(db){DB=db;attach();setTimeout(fin,8000)}else fin()},fin);
  }else fin();
}catch(e){fin()}
})();
</script>

</body></html>
